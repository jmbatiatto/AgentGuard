services:
  postgres:
    image: postgres:16-alpine
    container_name: agentguard-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: agentguard_db
      POSTGRES_USER: agentguard
      POSTGRES_PASSWORD: agentguard_secret
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentguard -d agentguard_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agentguard-net

  redis:
    image: redis:7-alpine
    container_name: agentguard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - agentguard-net

volumes:
  pgdata:
    name: agentguard-pgdata
  redisdata:
    name: agentguard-redisdata

networks:
  agentguard-net:
    name: agentguard-net
    driver: bridge
